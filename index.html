<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DIREMOUSE.COM</title>

    <style>
        body {
        margin: 0;
        background: #0C1145;
        font-family: Arial, sans-serif;
    
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
            }

        .logo {
    font-size: 64px;
    margin-top: -100;
    font-weight: bold;

    background: linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        green,
        cyan,
        blue,
        violet,
        red
    );

    background-size: 200% auto;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;

    animation: rainbow 3s linear infinite;
}

@keyframes rainbow {
    to {
        background-position: 200% center;
    }
}
    </style>
</head>

<body>

    <div class="logo">
        DIREMOUSE.COM
    </div>

</body>
</html>
