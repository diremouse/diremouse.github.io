<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DIREMOUSE.COM</title>

    <style>
        body {
            margin: 0;
            background: white;
            font-family: Arial, sans-serif;
        }

        .logo {
            font-size: 48px;
            font-weight: bold;

            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                green,
                cyan,
                blue,
                violet,
                red
            );

            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
    </style>
</head>

<body>

    <div class="logo">
        DIREMOUSE.COM
    </div>

</body>
</html>
