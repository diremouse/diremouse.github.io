<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DIREMOUSE.COM</title>

    <style>

        /* ========================================
           GENERAL PAGE
           ======================================== */

        body {
            margin: 0;
            background: #040721;
            font-family: Arial, sans-serif;
            color: white;
        }


        /* ========================================
           MAIN PAGE LAYOUT
           ======================================== */

        .page {
            width: 1400px;
            max-width: 95%;
            margin: 30px auto;

            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 30px;
        }


        /* ========================================
           CENTER COLUMN
           ======================================== */

        .center {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }


        /* ========================================
           LOGO
           ======================================== */

        .logo {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 15px;

            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                green,
                cyan,
                blue,
                violet,
                red
            );

            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;

            animation: rainbow 3s linear infinite;

            text-align: center;
        }


        @keyframes rainbow {
            to {
                background-position: 200% center;
            }
        }


        /* ========================================
           INTRO / TEXT BAR
           ======================================== */

        .intro {
            width: 100%;
            min-height: 45px;

            box-sizing: border-box;

            border: 4px solid white;
            background: #0a0e32;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 15px;

            text-align: center;
        }


        /* ========================================
           GAME GRID
           ======================================== */

        .games {
            width: 100%;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 25px;
        }


        /* ========================================
           GAME BUTTONS
           ======================================== */

        .game-button {
            height: 230px;

            border: 4px solid white;
            background: #0a0e32;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            box-sizing: border-box;

            text-decoration: none;

            font-size: 20px;

            transition: 0.2s;
        }


        .game-button:hover {
            background: #151b50;
            transform: scale(1.02);
        }


        /* ========================================
           SIDE PANELS
           ======================================== */

        .side-panel {
            min-height: 650px;

            border: 4px solid white;
            background: #0a0e32;

            box-sizing: border-box;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 20px;
        }


        /* ========================================
           TABLET
           ======================================== */

        @media (max-width: 1000px) {

            .page {
                width: 95%;

                grid-template-columns: 1fr;
            }


            .side-panel {
                min-height: 200px;
            }


            .logo {
                font-size: 48px;
            }

        }


        /* ========================================
           PHONE
           ======================================== */

        @media (max-width: 600px) {

            .page {
                width: 95%;
                margin: 15px auto;

                gap: 15px;
            }


            .logo {
                font-size: 32px;
            }


            .games {
                grid-template-columns: 1fr;
                gap: 15px;
            }


            .game-button {
                height: 180px;
            }


            .side-panel {
                min-height: 180px;
            }

        }

    </style>
</head>
<img src="gif/osakagif.gif" alt="Osaka Dance">

<body>

                <a href="#" class="game-button">

            </div>

        </main>


        <!-- ====================================

    </div>

</body>
</html>
